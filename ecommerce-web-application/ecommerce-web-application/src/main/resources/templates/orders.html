<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('My Orders')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="container">
  <h2>My Orders</h2>
  <p class="muted" th:if="${orders.empty}">You have not placed any orders yet.</p>
  <div class="card table-wrap" th:unless="${orders.empty}">
    <table>
      <thead><tr><th>Order</th><th>Date</th><th>Status</th><th>Total</th><th></th></tr></thead>
      <tbody>
        <tr th:each="o : ${orders}">
          <td th:text="'#' + ${o.id}">#1</td>
          <td th:text="${#temporals.format(o.createdAt, 'dd MMM yyyy HH:mm')}">date</td>
          <td><span class="tag" th:text="${o.status}">PLACED</span></td>
          <td th:text="'$' + ${o.totalAmount}">$0</td>
          <td><a class="btn small" th:href="@{/orders/{id}(id=${o.id})}">View</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
