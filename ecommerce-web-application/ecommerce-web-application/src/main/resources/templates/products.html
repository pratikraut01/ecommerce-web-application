<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Products')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="container">
  <div th:replace="~{fragments :: flash}"></div>

  <form class="filters card" method="get" th:action="@{/}" id="filterForm">
    <input type="search" name="q" th:value="${q}" placeholder="Search products...">
    <select name="cat" data-autosubmit>
      <option value="0">All categories</option>
      <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == cat}"></option>
    </select>
    <input type="number" name="min" th:value="${min}" min="0" step="0.01" placeholder="Min $">
    <input type="number" name="max" th:value="${max}" min="0" step="0.01" placeholder="Max $">
    <select name="sort" data-autosubmit>
      <option value="new" th:selected="${sort == 'new'}">Newest</option>
      <option value="priceAsc" th:selected="${sort == 'priceAsc'}">Price: low to high</option>
      <option value="priceDesc" th:selected="${sort == 'priceDesc'}">Price: high to low</option>
      <option value="name" th:selected="${sort == 'name'}">Name A-Z</option>
    </select>
    <button class="btn" type="submit">Search</button>
    <a class="btn ghost" th:href="@{/}">Reset</a>
  </form>

  <p class="muted"><span th:text="${page.totalElements}">0</span> product(s) found</p>
  <p class="muted center" th:if="${page.empty}">No products match your filters.</p>

  <div class="grid">
    <article class="card product" th:each="p : ${page.content}">
      <img th:src="${p.image}" th:alt="${p.name}" loading="lazy">
      <div class="body">
        <span class="tag" th:text="${p.category.name}">Cat</span>
        <h3 th:text="${p.name}">Name</h3>
        <p class="muted small" th:text="${p.description}">Desc</p>
        <div class="row">
          <strong class="price" th:text="'$' + ${p.price}">$0</strong>
          <span class="small" th:classappend="${p.stock == 0} ? 'out'" th:text="${p.stock > 0} ? ${p.stock} + ' in stock' : 'Out of stock'"></span>
        </div>
        <form th:action="@{/cart/add}" method="post">
          <input type="hidden" name="productId" th:value="${p.id}">
          <button class="btn full" th:disabled="${p.stock == 0}">Add to cart</button>
        </form>
      </div>
    </article>
  </div>

  <nav class="pager" th:if="${page.totalPages > 1}">
    <a class="btn ghost" th:if="${page.hasPrevious()}"
       th:href="@{/(q=${q},cat=${cat},min=${min},max=${max},sort=${sort},page=${page.number - 1})}">« Prev</a>
    <span>Page <span th:text="${page.number + 1}">1</span> of <span th:text="${page.totalPages}">1</span></span>
    <a class="btn ghost" th:if="${page.hasNext()}"
       th:href="@{/(q=${q},cat=${cat},min=${min},max=${max},sort=${sort},page=${page.number + 1})}">Next »</a>
  </nav>
</main>
</body>
</html>
