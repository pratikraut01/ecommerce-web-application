<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Admin')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="container">
  <div th:replace="~{fragments :: flash}"></div>
  <h2>Admin Dashboard</h2>

  <form class="card form wide" method="post" th:action="@{/admin/products}">
    <h3>Add product</h3>
    <div class="two">
      <label>Name<input name="name" required></label>
      <label>Category
        <select name="categoryId"><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option></select>
      </label>
      <label>Price<input type="number" name="price" min="0" step="0.01" required></label>
      <label>Stock<input type="number" name="stock" min="0" required></label>
    </div>
    <label>Image URL (optional)<input name="imageUrl"></label>
    <label>Description<textarea name="description" rows="2"></textarea></label>
    <button class="btn">Add product</button>
  </form>

  <h3>Products</h3>
  <div class="card table-wrap">
    <table>
      <thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead>
      <tbody>
        <tr th:each="p : ${products}">
          <td th:text="${p.id}">1</td><td th:text="${p.name}">N</td><td th:text="${p.category.name}">C</td>
          <td th:text="'$' + ${p.price}">$0</td><td th:text="${p.stock}">0</td>
          <td>
            <form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post" class="inline" data-confirm="Remove this product?">
              <button class="btn small danger">Remove</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <h3>Orders</h3>
  <div class="card table-wrap">
    <table>
      <thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th></th></tr></thead>
      <tbody>
        <tr th:each="o : ${orders}">
          <td><a th:href="@{/orders/{id}(id=${o.id})}" th:text="'#' + ${o.id}">#1</a></td>
          <td th:text="${o.user.name}">User</td>
          <td th:text="'$' + ${o.totalAmount}">$0</td>
          <td th:text="${o.payment != null} ? ${o.payment.method} + ' / ' + ${o.payment.status} : '-'">-</td>
          <td colspan="2">
            <form th:action="@{/admin/orders/{id}/status(id=${o.id})}" method="post" class="inline">
              <select name="status" data-autosubmit>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == o.status}"></option>
              </select>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
